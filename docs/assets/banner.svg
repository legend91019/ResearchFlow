<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="100%" role="img" aria-label="ResearchFlow Architecture Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="980" height="300" rx="18" fill="url(#bg)"/>
  <rect width="980" height="300" rx="18" fill="url(#glow1)"/>
  <rect width="980" height="300" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="978" height="298" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle architectural grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="54" x2="980" y2="54"/>
    <line x1="0" y1="166" x2="980" y2="166"/>
    <line x1="64" y1="0" x2="64" y2="300"/>
    <line x1="916" y1="0" x2="916" y2="300"/>
  </g>

  <!-- Top Eyebrow Pill -->
  <rect x="305" y="20" width="370" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="490" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.8">
    RESEARCH WORKSPACE PROTOCOL · ZERO CORE DEPENDENCIES
  </text>

  <!-- Main Brand Title -->
  <text x="490" y="96" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Research<tspan fill="url(#brand)">Flow</tspan>
  </text>

  <!-- Subtitle -->
  <text x="490" y="130" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500" fill="#cbd5e1">
    Evidence-Grounded AI Ideation &amp; Audited Experimentation for Native Coding Agents
  </text>

  <!-- Phase I Row: Ideation -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <text x="86" y="199" text-anchor="start" fill="#38bdf8" font-size="10.5" letter-spacing="0.5">IDEATION</text>

    <rect x="168" y="179" width="166" height="32" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="251" y="199" text-anchor="middle" fill="#e0f2fe">01 · Survey Scope</text>

    <text x="348" y="199" text-anchor="middle" fill="#475569">→</text>

    <rect x="362" y="179" width="174" height="32" rx="7" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="449" y="199" text-anchor="middle" fill="#dbeafe">02 · 4-Angle Map</text>

    <text x="550" y="199" text-anchor="middle" fill="#475569">→</text>

    <rect x="564" y="179" width="174" height="32" rx="7" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
    <text x="651" y="199" text-anchor="middle" fill="#e0e7ff">03 · Minimal Core</text>

    <text x="752" y="199" text-anchor="middle" fill="#475569">→</text>

    <rect x="766" y="179" width="150" height="32" rx="7" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="841" y="199" text-anchor="middle" fill="#ede9fe">04 · Blind Critic</text>
  </g>

  <!-- Phase II Row: Experimentation -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <text x="86" y="249" text-anchor="start" fill="#34d399" font-size="10.5" letter-spacing="0.5">EXPERIMENTS</text>

    <rect x="168" y="229" width="166" height="32" rx="7" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="251" y="249" text-anchor="middle" fill="#ccfbf1">05 · Gate 0 Pilot</text>

    <text x="348" y="249" text-anchor="middle" fill="#475569">→</text>

    <rect x="362" y="229" width="174" height="32" rx="7" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="449" y="249" text-anchor="middle" fill="#d1fae5">06 · Audited Plan</text>

    <text x="550" y="249" text-anchor="middle" fill="#475569">→</text>

    <rect x="564" y="229" width="174" height="32" rx="7" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
    <text x="651" y="249" text-anchor="middle" fill="#dcfce7">07A · 4D Preflight</text>

    <text x="752" y="249" text-anchor="middle" fill="#475569">→</text>

    <rect x="766" y="229" width="150" height="32" rx="7" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="841" y="249" text-anchor="middle" fill="#ecfdf5">07B · Live Kanban</text>
  </g>
</svg>
