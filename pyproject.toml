[project]
name = "researchflow"
version = "0.1.0"
description = "Research Workspace Protocol: lightweight host-agent harness for evidence-grounded AI research ideation and workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.pytest_tmp"
